# Entry config for invert_music.py — encode audio to noise / inversion artifact.
# Inherits generate.yaml fields; invert_stepper selects the inversion ODE (stepper@invert_stepper).
#
# comet_run_prefix: Comet run prefix (inv_*).
# exp_name, save_dir: experiment output directory.
# music_path: input wav/mp3 path (required).
# artifact_out: output .pt path for InversionArtifact; null to skip saving.
# alpha: fraction of inversion steps in [0,1] (1 = full trajectory).
# log_trajectory_images: log false-color latent grids to writer (slow).
# log_trajectory_max_edge: max edge length for trajectory images.
# log_local_error: per-step MSE between invert and forward stepper on one grid edge.
# time_grid_ratio: time grid compression (1.0 = full linspace 1→0).
defaults:
  - generate
  - stepper@invert_stepper: uni_euler
  - nti: default
  - _self_

comet_run_prefix: inv

exp_name: invert_run
save_dir: _exps/invert

music_path: ???

artifact_out: inverted_artifact.pt

alpha: 1.0

log_trajectory_images: false
log_trajectory_max_edge: 4096

log_local_error: false
time_grid_ratio: 1.0
