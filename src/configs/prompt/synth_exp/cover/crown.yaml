captions: "rap, aggressive, modern hip-hop, fast flow, punchy, female vocal"
lyrics: |
  [Intro]
  Yeah
  Static in the system

  [Verse 1 - fast flow]
  I got noise in my head, like a glitch in the wire
  Every step that I take just feeding the fire
  Got a chip on my shoulder, weight getting higher
  Try to cut me off, I’m a live amplifier

  They talk but it’s hollow, echo no follow
  I’m building a future, they stuck in tomorrow
  Borrowed ambition, I carved it in stone
  You’re looking for a throne, I already own

  [Pre-Chorus]
  Turn it up, let it break through

  [Chorus]
  Static crown on my head, no silence allowed
  Every doubt getting drowned in the sound so loud
  I don’t follow the wave, I rewrite the route
  If you step in my space, better figure it out
