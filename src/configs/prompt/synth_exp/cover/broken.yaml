captions: "alternative rock, emotional, atmospheric, female vocal, medium tempo"
lyrics: |
  [Verse]
  We were talking like the world would never end
  Every word was something we could always bend
  Now the silence hits me harder than before
  Like a distant signal lost beyond the shore

  [Verse]
  You were orbiting the edges of my mind
  Always just a little out of line
  Tried to pull you closer, hold you tight
  But you drifted further every night

  [Chorus]
  We're just broken satellites
  Falling through each other's skies
  Every message turned to noise
  Every silence amplified

  [Outro]
  Still I listen for your light