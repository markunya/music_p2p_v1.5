#
# guidance_scale: CFG scale (>1 enables null branch).
# cfg_t_start: lower time bound for CFG (inclusive).
# cfg_t_end: upper time bound for CFG (inclusive).
_target_: src.steppers.guidance.UniEulerGuidanceStepper
guidance_scale: 3.0
cfg_t_start: 0.0
cfg_t_end: 1.0
