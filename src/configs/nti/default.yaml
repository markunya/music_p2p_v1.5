# Null-text optimization (runs after inversion when ``enabled``; ``cfg.stepper`` must be a CFG guidance stepper — see ``CFG_GUIDANCE_STEPPERS`` in ``src/steppers/guidance.py``).
enabled: false
lr: 1.0e-2
num_inner_steps: 10
epsilon: 1.0e-7
# If true (default), outer step j>0 starts Adam from the optimized null at j-1. If false, every j resets from ``model.null_condition_emb``.
init_from_previous_outer: true
gradient_checkpointing: false
