# OptStepper — one init forward step, then Adam on a latent delta using opt_stepper with swapped time.
# Nested init_stepper and opt_stepper come from defaults (uni_euler + euler by default).
#
# lr: Adam learning rate at first inner step.
# lr_end: Adam learning rate at last inner step (linear schedule; equals lr if omitted in code).
# num_steps: inner optimization steps per ODE edge.
# norm_boundary: clamp max L2 norm of delta.
# epsilon: stop inner loop when loss falls below this (when applicable).
# reg_noise_std: Gaussian noise added to x_opt each inner step (0 = off).
# use_best_delta: if true, return delta with lowest loss; else last iterate.
defaults:
  - uni_euler@init_stepper
  - euler@opt_stepper
  - _self_

_target_: src.steppers.opt_stepper.OptStepper
lr: 0.001
lr_end: 0.001
num_steps: 10
norm_boundary: 0.05
epsilon: 1.0e-6
reg_noise_std: 0.0
use_best_delta: true
