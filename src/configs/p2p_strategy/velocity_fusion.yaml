# UniEdit-style edit: ``VelocityFusionEditRunner`` + stepper (time / spectral_time / spectral_spectral).
_target_: src.forward.steppers.velocity_fusion.VelocityFusionEditRunner

alpha: 0.6
omega: 5.0

# ``time`` — baseline UniEdit по латенту; ``spectral_*`` — STFT вдоль оси токена ``L`` (не герцы WAV).
fusion_mode: time

# Параметры torch.stft для spectral_* (игнорируются при fusion_mode=time).
stft_n_fft: 256
stft_hop_length: 64
stft_win_length: 256
stft_center: true
