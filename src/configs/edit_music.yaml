defaults:
  - invert_music
  - prompt@p2p_task.src: her_majesty
  - prompt@p2p_task.tgt: her_majesty_female
  - _self_

comet_run_prefix: edit

exp_name: p2p_edit_run
save_dir: _exps/p2p_edit

# Optional local edit windows in seconds: [[start, end], ...].
# If null/empty, ForwardPipeline uses full-range edit [[0, duration]].
edit_regions: null

# MSE between clean latents (pre-inversion encode) and forward ``final_latents[0]`` (src branch).
# Logged to loguru and ``writer.add_scalar`` (Comet when writer is CometMLWriter).
log_edit_latent_recon_mse: true