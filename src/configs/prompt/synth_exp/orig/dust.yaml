captions: "country rock, warm, storytelling, male vocal, acoustic guitar, slow tempo"
lyrics: |
  [Verse]
  Woke up with the sunrise burning through the blinds
  Coffee on the table, same old state of mind
  Truck outside is coughing like it knows my name
  Every road I travel feels a little bit the same

  [Verse]
  She said I was drifting like a worn-out song
  Always chasing something I can't hold for long
  Left her in the silence of a summer night
  Now the radio just never sounds quite right

  [Chorus]
  Dust and denim, miles behind me
  Every memory still reminds me
  You were more than passing time
  Guess I read the signs too blind

  [Outro]
  Rolling down the highway line, chasing ghosts I left behind