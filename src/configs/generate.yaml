# _self_ last so keys below override acestep/prompt/stepper groups and stay authoritative.
defaults:
  - acestep: default
  - prompt: example
  - stepper: euler
  - controller: dummy
  - writer: default
  - _self_

comet_run_prefix: gen

exp_name: gen_run
save_dir: _exps/gen
seed: 1
use_random_seed: false
debug_mode: false

duration: -1.0
inference_steps: 50
batch_size: 1

audio_format: wav

artifact:
  path: null
