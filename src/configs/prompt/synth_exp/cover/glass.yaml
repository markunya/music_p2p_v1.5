lyrics: |
  [Verse]
  In a quiet room where the colors bend
  I can hear your voice but it never ends
  Like a distant wave in a silent sea
  Something pulling you back to me

  [Chorus]
  We grow in glass gardens
  Fragile and weightless
  Reaching for something
  We don't understand

  [Outro]
  Fading into light again