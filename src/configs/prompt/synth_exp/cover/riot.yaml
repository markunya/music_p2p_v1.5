captions: "hard rock, alt metal, aggressive, loud chorus, female vocal"
lyrics: |
  [Intro]
  You feel it?

  [Verse 1 - quiet]
  There’s a riot living under my skin
  Every thought like a loaded sin
  I’ve been trying just to hold it down
  But it’s screaming when there’s no one around

  [Chorus - explosive]
  There’s a riot inside, I can’t control it
  Every line that I cross just keeps me going
  If I break, let it burn, let it show
  I don’t care if I lose it all

  [Verse 2]
  Every second like a ticking clock
  Every breath like a final shot
  I was never meant to play it safe
  I was built just to break the frame

  [Bridge - half-time]
  Let it out
  Let it out

  [Final Chorus]
  Riot inside, no way to hide

  [Outro]
  Just noise