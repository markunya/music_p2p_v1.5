# Entry config for edit_music.py — invert with src prompt, forward with src+tgt and optional attention control.
# Inherits invert_music; p2p_task holds prompt@p2p_task.src and prompt@p2p_task.tgt groups.
#
# comet_run_prefix: Comet run prefix (edit_*).
# exp_name, save_dir: experiment output directory.
# edit_regions: optional list of [start_sec, end_sec] edit windows; null = full clip.
# log_edit_latent_recon_mse: log MSE(clean latents, forward src branch final latent).
defaults:
  - invert_music
  - prompt@p2p_task.src: her_majesty
  - prompt@p2p_task.tgt: her_majesty_female
  - _self_

comet_run_prefix: edit

exp_name: p2p_edit_run
save_dir: _exps/p2p_edit

edit_regions: null

log_edit_latent_recon_mse: true
