# Generation params (seed, inference_steps, duration, …) come from `generate` via defaults — do not duplicate here.
# Inversion ODE: same presets as `stepper/` but mounted at `invert_stepper` (no duplicate config dir).
defaults:
  - generate
  - stepper@invert_stepper: uni_euler
  - nti: default
  - _self_

comet_run_prefix: inv

exp_name: invert_run
save_dir: _exps/invert

music_path: ???

artifact_out: inverted_artifact.pt

# Comet: false-color latent grids along inversion only (expensive).
log_trajectory_images: false
log_trajectory_max_edge: 4096
