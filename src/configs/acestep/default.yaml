# AceStepHandler initialization (init_dit_handler). project_root is required at runtime.
#
# project_root: path to ACE-Step-1.5 repo (checkpoints inside).
# config_path: model preset name (e.g. acestep-v15-base).
# use_mlx_dit: use MLX DiT backend when available.
# device: auto | cuda | mps | cpu.
# offload_to_cpu: offload weights to CPU where supported.
# offload_dit_to_cpu: offload DiT specifically to CPU (optional, read via getattr).
project_root: ../ACE-Step-1.5
config_path: acestep-v15-base
use_mlx_dit: false
device: auto
offload_to_cpu: false
offload_dit_to_cpu: false
