# P2P edit (velocity fusion): ``generate`` + инверсия + ``VelocityFusionEditRunner``.
# Запуск: ``python edit_music.py`` или ``python edit_music.py --config-name=p2p_edit_velocity ...``
defaults:
  - generate
  - invert_nti
  - writer: default
  - p2p_strategy: velocity_fusion
  - prompt@p2p_task.src: her_majesty
  - prompt@p2p_task.tgt: her_majesty_edited
  - _self_

exp_name: p2p_edit_run
save_dir: _exps/p2p_edit

forward:
  mode: velocity_fusion

p2p_task:
  vocal_language: en

source_audio_path: null
artifact_path: null
