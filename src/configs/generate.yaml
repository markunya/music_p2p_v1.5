# _self_ last so keys below override acestep/prompt groups and stay authoritative.
defaults:
  - acestep: default
  - prompt: example
  - _self_

exp_name: gen_run
save_dir: _exps/gen
seed: 1
debug_mode: false

duration: -1.0
vocal_language: en
inference_steps: 10
guidance_scale: 7.0
use_random_seed: false
batch_size: 1
task_type: text2music
shift: 1.0
infer_method: ode
sampler_mode: euler
use_adg: false
cfg_interval_start: 0.0
cfg_interval_end: 1.0

artifact:
  path: null
