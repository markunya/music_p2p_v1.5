captions: "synthwave, dark, atmospheric, nostalgic, female vocal, medium tempo"
lyrics: |
  [Intro]
  Neon lights are fading slow, in the city afterglow

  [Verse]
  Driving through the empty streets, shadows dancing to the beat
  Radio is whispering secrets only night can keep
  Every sign is glowing red, every thought inside my head
  Feels like something left unsaid, echoes pulling me instead

  [Chorus]
  Stay with me in midnight static
  Lost between the real and magic
  Every signal breaking through
  Somehow always leads to you

  [Outro]
  Neon lights are fading slow, but I never let you go