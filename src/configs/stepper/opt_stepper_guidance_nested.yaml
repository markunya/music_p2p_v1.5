# Wraps two steppers: init forward step, then small delta optimization vs opt stepper with swapped time.
defaults:
  - gci_opt@init_stepper
  - guidance_euler@opt_stepper
  - _self_

_target_: src.steppers.opt_stepper.OptStepper
lr: 0.001
lr_end: 0.0001
num_steps: 20
norm_boundary: 0.05
epsilon: 1.0e-8
