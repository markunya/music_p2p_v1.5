# Generation params (seed, inference_steps, duration, …) come from `generate` via defaults — do not duplicate here.
# Inversion ODE: same presets as `stepper/` but mounted at `invert_stepper` (no duplicate config dir).
defaults:
  - generate
  - stepper@invert_stepper: uni_euler
  - nti: default
  - _self_

comet_run_prefix: inv

exp_name: invert_run
save_dir: _exps/invert

music_path: ???

artifact_out: inverted_artifact.pt

# alpha in [0, 1]: fraction of inversion steps to run (1.0 = full inversion).
# Partial inversion stores latent at t ~ alpha; ForwardPipeline starts at step N-K.
alpha: 1.0

# Comet: false-color latent grids along inversion only (expensive).
log_trajectory_images: false
log_trajectory_max_edge: 4096

# After each inversion step: one forward ``stepper`` step (same time edge as ForwardPipeline) and
# MSE(x_hat, x_before) / dt (forward time step); compares ``invert_stepper`` vs ``stepper`` on one grid.
# Logged via loguru and ``writer.add_scalar`` ``inv/local_error_mse_per_dt`` (Comet when writer is CometMLWriter).
log_local_error: false
time_grid_ratio: 1.0