# GuidanceContinuationInversionStepper — CFG inversion with inner continuation steps per ODE edge.
# Composes a nested base_stepper (default uni_euler via defaults). Used as invert_stepper in edit/invert.
#
# guidance_scale: target CFG scale at end of continuation ramp.
# cfg_t_start: lower time bound for CFG (inclusive).
# cfg_t_end: upper time bound for CFG (inclusive).
# continuation_steps: inner fixed-point iterations per step (ramps scale from 1.0 to guidance_scale).
# j_approx: use Jacobian approximation in GCI update.
# j_eps: finite-difference epsilon when j_approx is true.
defaults:
  - uni_euler@base_stepper
  - _self_

_target_: src.steppers.guidance.GuidanceContinuationInversionStepper
guidance_scale: 2.0
cfg_t_start: 0.0
cfg_t_end: 1.0
continuation_steps: 10
j_approx: false
j_eps: 1.0e-3
